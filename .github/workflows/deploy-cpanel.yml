name: Build & Deploy (cPanel)

# Builds the backend + frontend, assembles an upload-ready release bundle, and
# deploys it to cPanel over FTPS.
#
# The `build` job always runs. The `preflight` job then decides whether to
# deploy and REPORTS the decision in the run summary. It FAILS LOUDLY when you
# push to a deploy branch but deploy is off/misconfigured — so a green check
# can never again mean "built but shipped nothing". The `deploy` job uploads
# only when preflight says so.
#
# To actually ship to the live site, configure (one-time):
#   Settings -> Secrets and variables -> Actions -> Secrets
#     FTP_SERVER     e.g. ftp.magicframes.nokkoo.in
#     FTP_USERNAME   cPanel / FTP account username
#     FTP_PASSWORD   cPanel / FTP account password
#   Settings -> Secrets and variables -> Actions -> Variables
#     DEPLOY_ENABLED = true     (safety switch that turns deploys on)
#
# Or run the workflow manually (Actions -> Run workflow) with
# force_deploy = true to deploy without flipping DEPLOY_ENABLED.

on:
  push:
    branches: [main, feat/wedding-album-app]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Deploy to cPanel even if DEPLOY_ENABLED is not set to true'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Backend (Laravel) ----
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, openssl, tokenizer, xml, ctype, bcmath, fileinfo, curl, gd, zip
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # ---- Frontend (React/Vite) ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---- Assemble the upload-ready release bundle ----
      # Mirrors the cPanel layout:
      #   release/app/      -> Laravel app (goes to ~/laravel/album-magicframes)
      #   release/docroot/  -> doc-root contents (SPA + front controller + .htaccess)
      - name: Assemble release bundle
        run: |
          set -e
          mkdir -p release/app release/docroot

          # Laravel app (exclude dev-only + local artifacts)
          rsync -a --delete \
            --exclude '.git' --exclude 'tests' --exclude '.env' \
            --exclude 'database/database.sqlite' \
            --exclude 'storage/logs/*' \
            backend/ release/app/

          # Ensure runtime dirs exist on target
          mkdir -p release/app/storage/framework/{cache,sessions,views} release/app/storage/logs

          # Doc root: React build output
          cp -r frontend/dist/. release/docroot/

          # Doc root: Laravel front controller + routing + static assets
          cp deploy/cpanel/index.php            release/docroot/index.php
          cp deploy/cpanel/htaccess-docroot.txt release/docroot/.htaccess
          cp backend/public/favicon.ico         release/docroot/favicon.ico || true
          cp backend/public/robots.txt          release/docroot/robots.txt  || true

          echo "Release bundle contents:"
          find release -maxdepth 2 -type d | sort

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicframes-release
          path: release/
          retention-days: 7

  # Decide whether we should deploy — and make the decision VISIBLE and LOUD.
  # This job always runs, writes a summary explaining the outcome, and FAILS
  # the workflow when a push to a deploy branch cannot actually ship (so you
  # never again see a green check that quietly deployed nothing).
  preflight:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    env:
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_deploy }}
      HAS_SECRETS: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - name: Decide & report
        id: decide
        run: |
          set -euo pipefail

          enabled="${DEPLOY_ENABLED:-}"
          forced="${FORCE_DEPLOY:-false}"
          has_secrets="${HAS_SECRETS:-false}"
          event="${GITHUB_EVENT_NAME}"

          want_deploy="false"
          if [ "$enabled" = "true" ] || [ "$forced" = "true" ]; then
            want_deploy="true"
          fi

          {
            echo "## cPanel deploy preflight"
            echo ""
            echo "| Check | Value |"
            echo "|-------|-------|"
            echo "| Event | \`$event\` |"
            echo "| DEPLOY_ENABLED variable | \`${enabled:-<unset>}\` |"
            echo "| force_deploy input | \`$forced\` |"
            echo "| FTP secrets present | \`$has_secrets\` |"
            echo "| Deploy requested | \`$want_deploy\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Not requested at all.
          if [ "$want_deploy" != "true" ]; then
            {
              echo ""
              echo "### ⏭️ Deploy NOT performed — build only"
              echo ""
              echo "Your code was built successfully but **was not uploaded to the live site**."
              echo "To ship changes to album-magicframes.nokkoo.in, set the repository variable"
              echo "**DEPLOY_ENABLED = true** (Settings → Secrets and variables → Actions → Variables),"
              echo "or run this workflow manually with **force_deploy = true**."
            } >> "$GITHUB_STEP_SUMMARY"

            # Fail loudly on a push to a real deploy branch so the silent
            # no-op can never masquerade as a successful deployment again.
            if [ "$event" = "push" ]; then
              echo "::error title=Deploy skipped::Pushed to a deploy branch but DEPLOY_ENABLED is not 'true'. The live site was NOT updated. Set DEPLOY_ENABLED=true (repo Variables) or re-run with force_deploy=true."
              exit 1
            fi

            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Requested, but credentials are missing — fail loudly.
          if [ "$has_secrets" != "true" ]; then
            {
              echo ""
              echo "### ❌ Deploy requested but FTP secrets are missing"
              echo ""
              echo "Add these under Settings → Secrets and variables → Actions → **Secrets**:"
              echo "\`FTP_SERVER\`, \`FTP_USERNAME\`, \`FTP_PASSWORD\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing FTP secrets::Deploy was requested but one or more of FTP_SERVER / FTP_USERNAME / FTP_PASSWORD is not set. Cannot upload to cPanel."
            exit 1
          fi

          {
            echo ""
            echo "### 🚀 Deploy will run"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [build, preflight]
    runs-on: ubuntu-latest
    if: needs.preflight.outputs.should_deploy == 'true'
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: magicframes-release
          path: release

      # Deploy the SPA + doc-root files to the public doc root.
      - name: Deploy doc root (SPA + front controller)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./release/docroot/
          # Doc root per DEPLOYMENT_CPANEL.md: /home/uddjzwrz/album-magicframes.nokkoo.in
          # (FTP login is rooted at the home dir, so this path is relative to it).
          server-dir: /album-magicframes.nokkoo.in/

      # Deploy the Laravel application outside the doc root.
      # NOTE: run `php artisan migrate --force && config:cache && route:cache`
      # on the server after this (cPanel Terminal or the Step 6 cron), since
      # FTP cannot run PHP. deploy/cpanel/setup.sh does exactly that.
      - name: Deploy Laravel app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./release/app/
          server-dir: /laravel/album-magicframes/
          # Never overwrite the server's secrets or local DB.
          exclude: |
            **/.env
            **/database/database.sqlite

      - name: Report deploy result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            {
              echo "### ✅ Uploaded to cPanel"
              echo ""
              echo "The SPA + Laravel app were uploaded over FTPS."
              echo ""
              echo "**Finish on the server** (FTP can't run PHP) — in cPanel Terminal:"
              echo '```bash'
              echo "cd ~/laravel/album-magicframes"
              echo "php artisan migrate --force && php artisan config:cache && php artisan route:cache"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Upload failed — check the FTP steps above" >> "$GITHUB_STEP_SUMMARY"
          fi
